# SYNAPSE CHANNEL — secure production compose profile

services:
  hub:
    build: .
    image: ghcr.io/anulum/synapse-channel:latest
    container_name: synapse-hub
    restart: unless-stopped
    user: "${SYNAPSE_UID:?Set SYNAPSE_UID to the secret owner uid}:${SYNAPSE_GID:?Set SYNAPSE_GID to the secret owner gid}"
    ports:
      - "127.0.0.1:8876:8876"
    networks:
      - hub-isolated
    environment:
      SSL_CERT_FILE: /run/synapse/tls.crt
    volumes:
      - type: bind
        source: ${SYNAPSE_DATA_DIR:?Set SYNAPSE_DATA_DIR to an owner-only directory}
        target: /data
      - type: bind
        source: ${SYNAPSE_TOKEN_FILE:?Set SYNAPSE_TOKEN_FILE to a mode-0600 token}
        target: /run/synapse/token
        read_only: true
      - type: bind
        source: ${SYNAPSE_DB_KEY_FILE:?Set SYNAPSE_DB_KEY_FILE to a mode-0600 SQLCipher key}
        target: /run/synapse/db.key
        read_only: true
      - type: bind
        source: ${SYNAPSE_TLS_CERT_FILE:?Set SYNAPSE_TLS_CERT_FILE to a trusted certificate chain}
        target: /run/synapse/tls.crt
        read_only: true
      - type: bind
        source: ${SYNAPSE_TLS_KEY_FILE:?Set SYNAPSE_TLS_KEY_FILE to a mode-0600 private key}
        target: /run/synapse/tls.key
        read_only: true
    command:
      - hub
      - --host=0.0.0.0
      - --port=8876
      - --advertised-host=127.0.0.1:8876
      - --token-file=/run/synapse/token
      - --db=/data/hub.db
      - --db-key-file=/run/synapse/db.key
      - --tls-certfile=/run/synapse/tls.crt
      - --tls-keyfile=/run/synapse/tls.key
    healthcheck:
      test:
        - CMD
        - synapse
        - health
        - --uri=wss://127.0.0.1:8876
        - --token-file=/run/synapse/token
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # Dedicated single-service network. The token and TLS still protect the hub
  # if a future edit accidentally attaches another container here.
  hub-isolated:
    driver: bridge
