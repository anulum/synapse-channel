# SYNAPSE CHANNEL — build once and publish the canonical distributions to PyPI
name: publish

# Keep the trusted-publish job tag-triggered so its OIDC identity and attestations
# remain bound to refs/tags/v*. release.yml consumes this run's immutable artifact
# afterward; neither workflow performs a second build. Attestation failure blocks
# PyPI publication, and recovery reruns this tag workflow from the failed job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-tools.txt
      - name: Refuse a stale capability snapshot
        run: python tools/capability_manifest.py --check
      - name: Build the release payload with the repository's own recipe
        # The tool exports the tagged commit under umask 0022, refuses build tools
        # other than the pins installed above, builds without isolation at the
        # commit time and repacks the sdist; a consumer runs the same recipe.
        run: python tools/build_release_payload.py --out release-artifact
      - run: python -m twine check release-artifact/*.whl release-artifact/*.tar.gz
      - name: Generate CycloneDX SBOM for the built wheel
        run: |
          python -m venv .sbom-venv
          # The build job has no OIDC permission. The pinned SBOM tool observes the
          # exact wheel that the later trusted-publish job receives.
          .sbom-venv/bin/python -m pip install release-artifact/*.whl
          python -m pip install --require-hashes -r .github/requirements/requirements-sbom.txt
          cyclonedx-py environment .sbom-venv/bin/python \
            --output-reproducible \
            --output-format JSON \
            --output-file "release-artifact/synapse-channel-${GITHUB_REF_NAME}-sbom.cdx.json"
      - name: Record the exact release payload and digests
        working-directory: release-artifact
        run: sha256sum -- *.whl *.tar.gz *-sbom.cdx.json > SHA256SUMS
      - name: Preserve the canonical release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: release-artifact/
          if-no-files-found: error

  integrity:
    # Provenance proves which artifact was built; this proves it works. Install
    # the exact wheel and sdist in clean environments and confirm they ship the
    # same importable package with no partial test tree — publication blocks on it.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release-artifact/
      - name: Install the built wheel and load every console entry point
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --require-hashes -r .github/requirements/requirements-publish-smoke.txt
          wheel_path="$(ls release-artifact/*.whl)"
          printf 'synapse-channel @ file://%s#sha256=%s\n' "$PWD/$wheel_path" "$(sha256sum "$wheel_path" | cut -d' ' -f1)" > .wheel-req.txt
          .wheel-venv/bin/python -m pip install --require-hashes --no-deps -r .wheel-req.txt
          .wheel-venv/bin/python -c "import synapse_channel; print(synapse_channel.__version__)"
          .wheel-venv/bin/python tools/check_installed_console_scripts.py \
            --project-metadata pyproject.toml
          .wheel-venv/bin/synapse --help >/dev/null
      - name: Install the source distribution in a clean environment and smoke it
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install --require-hashes -r .github/requirements/requirements-publish-smoke.txt
          sdist_path="$(ls release-artifact/*.tar.gz)"
          printf 'synapse-channel @ file://%s#sha256=%s\n' "$PWD/$sdist_path" "$(sha256sum "$sdist_path" | cut -d' ' -f1)" > .sdist-req.txt
          .sdist-venv/bin/python -m pip install --require-hashes --no-deps --no-build-isolation -r .sdist-req.txt
          .sdist-venv/bin/python -c "import synapse_channel; print(synapse_channel.__version__)"
          .sdist-venv/bin/synapse --help >/dev/null
      - name: Verify wheel and sdist ship the same package and the sdist has no tests
        run: python tools/check_wheel_sdist_parity.py release-artifact/*.whl release-artifact/*.tar.gz

  reproduce:
    # A second runner, with another Python, builds the same tag from its own
    # checkout with the same recipe. attest compares the two before anything is
    # signed, so a payload that does not reproduce is never published.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-tools.txt
      - name: Rebuild the release payload independently
        run: python tools/build_release_payload.py --out reproduced
      - name: Preserve the independent digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reproduced-digests
          path: reproduced/SHA256SUMS
          if-no-files-found: error

  attest:
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release-artifact/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: reproduced-digests
          path: reproduced/
      - name: Require the independent rebuild to match before signing
        run: |
          set -euo pipefail
          # Each line names both digests of one file, so a mismatch explains itself.
          built_names="$(find release-artifact -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -printf '%f\n' | sort)"
          rebuilt_names="$(sed -E 's/^[0-9a-f]{64}  //' reproduced/SHA256SUMS | sort)"
          if [ "$built_names" != "$rebuilt_names" ]; then
            printf 'built: %s\nreproduced: %s\n' "$built_names" "$rebuilt_names" >&2
            exit 1
          fi
          status=0
          while IFS= read -r line; do
            rebuilt="${line%%  *}"
            name="${line#*  }"
            built="$(sha256sum -- "release-artifact/$name" | cut -d' ' -f1)"
            echo "$name built $built reproduced $rebuilt"
            if [ "$built" != "$rebuilt" ]; then status=1; fi
          done < reproduced/SHA256SUMS
          exit "$status"
      - name: Verify the exact release payload before signing
        working-directory: release-artifact
        run: |
          sha256sum --check --strict SHA256SUMS
          diff -u \
            <(sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort) \
            <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
      - name: Sign SLSA provenance for the canonical payload
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-artifact/SHA256SUMS
      - name: Preserve the portable Sigstore bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir -p release-provenance
          cp "$BUNDLE_PATH" \
            "release-provenance/synapse-channel-${GITHUB_REF_NAME}-provenance.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-provenance
          path: release-provenance/
          if-no-files-found: error

  publish:
    needs: [build, attest, integrity]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-dist
          path: release-artifact/
      - name: Verify the exact release payload and digests
        working-directory: release-artifact
        run: |
          sha256sum --check --strict SHA256SUMS
          diff -u \
            <(sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort) \
            <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
      - name: Stage only verified Python distributions
        run: |
          mkdir publish-dist
          cp release-artifact/*.whl release-artifact/*.tar.gz publish-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: publish-dist/
