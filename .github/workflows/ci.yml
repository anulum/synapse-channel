# SYNAPSE CHANNEL — continuous integration
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_runner:
        description: Runner image for the test matrix (qualify a new image before switching)
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-26.04

permissions:
  contents: read

concurrency:
  # A main push gets a commit-specific group and cannot cancel an earlier head.
  # Pull-request and manual runs keep replacing stale work on their shared ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The structure budget compares its ledger with the parent commit.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: ruff check src tests benchmarks examples
      - run: ruff format --check src tests benchmarks examples
      - run: python -m bandit -q -r src -c pyproject.toml
      - name: Capability snapshot drift
        run: python tools/capability_manifest.py --check
      - name: External transport effective-policy drift
        run: python tools/audit_external_transport_policy.py --check
      - name: Test taxonomy inventory (docs_contract / e2e honesty)
        run: python tools/report_test_taxonomy.py --tests-root tests
      - name: Cockpit CI and npm-lock integrity
        run: python tools/check_cockpit_ci.py --check
      - name: Structure budget (no ceiling rises, no new unit over a threshold)
        run: python -m tools.check_structure_budget --check --baseline HEAD^

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: mypy

  test-timings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Select one immutable scheduling snapshot for every worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p timing-input
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"             --jq '.workflow_runs[0].id // empty')"
          artifact=""
          if [ -n "$previous" ]; then
            artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous/artifacts?per_page=100"               --jq '[.artifacts[] | select(.name == "pytest-shard-timings" and .expired == false)] |
                if length > 1 then error("duplicate timing history") else .[0].id // empty end')"
          fi
          if [ -n "$artifact" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > timing-history.zip
          fi
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          from tools.pytest_shard_schedule import load_shard_timings

          archive = Path("timing-history.zip")
          output = Path("timing-input/timings.json")
          if archive.exists():
              with zipfile.ZipFile(archive) as bundle:
                  if bundle.namelist() != ["timings.json"]:
                      raise ValueError("unexpected timing history members")
                  entry = bundle.getinfo("timings.json")
                  if entry.file_size > 16 * 1024 * 1024:
                      raise ValueError("oversized timing history")
                  with bundle.open(entry) as stream:
                      raw = stream.read(16 * 1024 * 1024 + 1)
                  if len(raw) > 16 * 1024 * 1024:
                      raise ValueError("oversized timing history")
                  output.write_bytes(raw)
          else:
              output.write_text(json.dumps({"schema": 1, "profiles": {}}) + "\n")
          load_shard_timings(output, "3.12")
          PY
      - name: Distribute the exact common timing input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-timings-${{ github.sha }}-${{ github.run_id }}
          path: timing-input/timings.json
          if-no-files-found: error
          overwrite: true

  test:
    # Pinned to ubuntu-26.04, qualified on the whole matrix by run 41528157721. A manual
    # run can still select ubuntu-24.04 to compare a regression against the old image.
    runs-on: ${{ inputs.test_runner || 'ubuntu-26.04' }}
    # Shards finish in 10-20 minutes; a hung test fails the job within the
    # hour instead of holding the runner for the six-hour platform default.
    timeout-minutes: 60
    needs: [test-timings]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/requirements/requirements-dev.txt
            .github/requirements/requirements-ci-tpm.txt
            .github/requirements/requirements-legacy-release.txt
            .github/requirements/requirements-release-admission.txt
      # SoftHSM2 provides a PKCS#11 module and swtpm a software TPM 2.0, so the at-rest hardware
      # key backends run (not skip); libtss2-dev builds tpm2-pytss (sdist-only, no wheel).
      # The runner ships Microsoft/Azure apt sources whose signing intermittently breaks
      # ("repository is no longer signed"), which fails apt-get update; none of the packages below
      # come from them, so drop those sources first to keep the setup resilient to that flake.
      - name: Install SoftHSM and the software TPM
        run: |
          set -euo pipefail
          timeout 300 bash -c '
            set -euo pipefail
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
              /etc/apt/sources.list.d/azure-cli.list \
              /etc/apt/sources.list.d/azure-cli.sources
            sudo apt-get update
            sudo apt-get install -y softhsm2 swtpm swtpm-tools tpm2-tools \
              libtss2-dev tmux libseccomp2 bubblewrap dbus-user-session
          '
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-dev.txt
      - name: Prepare and verify the native Linux test session
        uses: ./.github/actions/native-user-session
      - run: python -m pip install -e . --no-deps
      # The hash-locked dev cohort includes the shipped gRPC dependency. Keep the
      # capability fail-closed so the real loopback/TLS/mTLS tests cannot silently skip.
      - name: Require the real gRPC test capability
        run: python -c "import grpc; assert grpc.__version__"
      - name: Restore the common immutable scheduling input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pytest-timings-${{ github.sha }}-${{ github.run_id }}
          path: timing-input
      - name: Prepare the native foreign-owner fixture
        uses: ./.github/actions/native-file-owner
      - name: Prepare the published no-receipt hub fixture
        run: >-
          python -m pip download --require-hashes --no-deps --only-binary=:all:
          -r .github/requirements/requirements-legacy-release.txt
          --dest .pytest_cache/legacy-release
      - name: Prepare the published exact-confirmation admission fixture
        run: >-
          python -m pip download --require-hashes --no-deps --only-binary=:all:
          -r .github/requirements/requirements-release-admission.txt
          --dest .pytest_cache/legacy-release
      # tpm2-pytss is sdist-only and needs both the TSS2 headers above and build requirements from
      # the dev lock. Disable build isolation so it cannot fetch a second unpinned build cohort.
      - name: Install the hash-locked TPM 2.0 test capability
        run: >-
          python -m pip install --require-hashes --no-build-isolation
          -r .github/requirements/requirements-ci-tpm.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python-version == '3.12'
        with:
          node-version: "22.23.4"
      - name: Install exact Codex CLI host for native package coverage
        if: matrix.python-version == '3.12'
        working-directory: integrations/codex-cli
        run: npm ci --ignore-scripts
      - name: Install exact Pi host for offline RPC diagnosis coverage
        if: matrix.python-version == '3.12'
        working-directory: integrations/pi
        run: |
          npm ci --ignore-scripts
          python ../../tools/sync_pi_dependency_pins.py
      - name: Install exact Claude Code host for real plugin coverage
        if: matrix.python-version == '3.12'
        working-directory: integrations/claude-code
        env:
          DISABLE_TELEMETRY: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/claude-bin"
          cat > "$RUNNER_TEMP/claude-bin/claude" <<'SH'
          #!/usr/bin/env bash
          exec node "$GITHUB_WORKSPACE/integrations/claude-code/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs" "$@"
          SH
          chmod 755 "$RUNNER_TEMP/claude-bin/claude"
          test "$("$RUNNER_TEMP/claude-bin/claude" --version)" = '2.1.311 (Claude Code)'
          echo "$RUNNER_TEMP/claude-bin" >> "$GITHUB_PATH"
      - name: Install exact OpenCode host for native composer coverage
        if: matrix.python-version == '3.12'
        env:
          OPENCODE_ARCHIVE_SHA256: 3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b
          OPENCODE_BINARY_SHA256: 513f500a1a5ea1dc7d865547ac87b32a8936334e8d5abd5b3ff585c45a170080
          OPENCODE_URL: https://github.com/anomalyco/opencode/releases/download/v1.18.32/opencode-linux-x64.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-coverage-linux-x64.tar.gz"
          bin_dir="$RUNNER_TEMP/opencode-coverage-1.18.32/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --retry 3 --connect-timeout 15 --max-time 120 \
            --output "$archive" "$OPENCODE_URL"
          printf '%s  %s\n' "$OPENCODE_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir"
          chmod 0755 "$bin_dir/opencode"
          printf '%s  %s\n' "$OPENCODE_BINARY_SHA256" "$bin_dir/opencode" \
            | sha256sum --check --strict
          test "$("$bin_dir/opencode" --version)" = "1.18.32"
          tmux -V
          echo "OPENCODE_BIN=$bin_dir/opencode" >> "$GITHUB_ENV"
      - name: Prepare isolated kernel coverage output
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p native-kernel-coverage "$RUNNER_TEMP/coverage-data"
          echo "COVERAGE_FILE=$RUNNER_TEMP/coverage-data/.coverage" >> "$GITHUB_ENV"
      - name: Run a complete indexed coverage shard
        if: matrix.python-version == '3.12'
        env:
          DISABLE_TELEMETRY: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          SYNAPSE_TEST_CODEX_BIN: ${{ github.workspace }}/integrations/codex-cli/node_modules/.bin/codex
          SYNAPSE_TEST_PI_BIN: ${{ github.workspace }}/integrations/pi/node_modules/.bin/pi
          SYNAPSE_TEST_COVERAGE_DIR: ${{ github.workspace }}/native-kernel-coverage
        run: >-
          bash tools/run_delegated_tests.sh python -m pytest tests
          -p tools.pytest_shard -p tools.pytest_native_coverage
          --shard-index=${{ matrix.shard }} --shard-count=4 --shard-output=shard-main.json
          --shard-timings=timing-input/timings.json
          -o 'python_files=test_*.py *_test.py protected_paths_linux.py protected_install_artifacts_linux.py protected_installation_set_linux.py protected_sealed_installation_linux.py protected_write_cgroup_controls_linux.py protected_write_cgroup_parsing_linux.py protected_write_kernel_boundary_linux.py protected_write_kernel_capture_races_linux.py protected_write_mount_attributes_linux.py protected_write_mounts_linux.py protected_write_subtree_linux.py protected_write_subtree_membership_linux.py protected_write_subtree_stop_linux.py protected_write_descriptor_filter_linux.py protected_write_sequence_linux.py protected_write_execution_frontier_linux.py protected_write_observation_effect_faults_linux.py protected_write_observation_topology_faults_linux.py protected_write_recovery_admission_inputs_linux.py protected_write_recovery_candidate_linux.py protected_write_recovery_escaped_descriptor_linux.py protected_write_recovery_evidence_linux.py protected_write_recovery_snapshot_linux.py protected_write_recovery_topology_faults_linux.py protected_write_kernel_execution_linux.py protected_write_filtered_status_ipc_linux.py protected_write_prebegin_race_linux.py'
          --cov=synapse_channel --cov-report= --cov-fail-under=0
      - name: Run a complete indexed compatibility shard
        if: matrix.python-version != '3.12'
        run: >-
          bash tools/run_delegated_tests.sh python -m pytest tests -p tools.pytest_shard
          --shard-index=${{ matrix.shard }} --shard-count=4 --shard-output=shard-main.json
          --shard-timings=timing-input/timings.json
          -o 'python_files=test_*.py *_test.py protected_paths_linux.py protected_install_artifacts_linux.py protected_installation_set_linux.py protected_sealed_installation_linux.py protected_write_cgroup_controls_linux.py protected_write_cgroup_parsing_linux.py protected_write_kernel_boundary_linux.py protected_write_kernel_capture_races_linux.py protected_write_mount_attributes_linux.py protected_write_mounts_linux.py protected_write_subtree_linux.py protected_write_subtree_membership_linux.py protected_write_subtree_stop_linux.py protected_write_descriptor_filter_linux.py protected_write_sequence_linux.py protected_write_execution_frontier_linux.py protected_write_observation_effect_faults_linux.py protected_write_observation_topology_faults_linux.py protected_write_recovery_admission_inputs_linux.py protected_write_recovery_candidate_linux.py protected_write_recovery_escaped_descriptor_linux.py protected_write_recovery_evidence_linux.py protected_write_recovery_snapshot_linux.py protected_write_recovery_topology_faults_linux.py protected_write_kernel_execution_linux.py protected_write_filtered_status_ipc_linux.py protected_write_prebegin_race_linux.py'
      - name: Native Linux metadata refusal with accumulated coverage
        if: matrix.python-version == '3.12' && matrix.shard == 0
        run: >-
          python -m pytest tests/fixtures/opencode/metadata_denial_linux.py -p tools.pytest_shard
          --shard-index=0 --shard-count=1 --shard-output=shard-native.json
          --cov=synapse_channel --cov-append --cov-report= --cov-fail-under=0
      - name: Native Linux metadata refusal across Python versions
        if: matrix.python-version != '3.12' && matrix.shard == 0
        run: >-
          python -m pytest tests/fixtures/opencode/metadata_denial_linux.py -p tools.pytest_shard
          --shard-index=0 --shard-count=1 --shard-output=shard-native.json
      - name: Import check
        run: python -c "import synapse_channel; assert synapse_channel.__version__"
      - name: Bind all mandatory successful observations into the indexed artifact
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          PYTHON_PROFILE: ${{ matrix.python-version }}
        run: |
          args=(--manifest shard-main.json --output ci-shard-artifact)
          if [ "$SHARD_INDEX" = 0 ]; then args+=(--native-manifest shard-native.json); fi
          if [ "$PYTHON_PROFILE" = 3.12 ]; then
            bash tools/combine_native_coverage.sh
            args+=(--coverage-file "$COVERAGE_FILE")
          fi
          python tools/ci_shard_artifacts.py pack "${args[@]}"
          if [ "$PYTHON_PROFILE" = 3.12 ]; then
            cp -a native-kernel-coverage-probe ci-shard-artifact/probe-observations
          fi
      - name: Publish authoritative shard only after every mandatory command passes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-shard-${{ github.sha }}-${{ matrix.python-version }}-${{ matrix.shard }}
          path: ci-shard-artifact/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  test-windows:
    # Lines only Windows runs (Win32 openers, process accounting, the native queue)
    # are measured here and join the complete coverage gate in test-complete (owner
    # decision 2026-11-12); the threshold there is unchanged. The part is the set of
    # test files that exercise them and pass on hosted Windows: the full suite does
    # not finish on that runner (see cross-os.yml).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/requirements/requirements-dev.txt
            .github/requirements/requirements-legacy-release.txt
            .github/requirements/requirements-release-admission.txt
      # The Windows process-accounting tests bind the interpreter a virtual
      # environment's launcher starts, as on a native Windows host; every later
      # step's python is that environment's.
      - name: Create the virtual environment the Windows tests run in
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\windows-venv"
          "$env:RUNNER_TEMP\windows-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - name: Prepare the published no-receipt hub fixture
        run: >-
          python -m pip download --require-hashes --no-deps --only-binary=:all:
          -r .github/requirements/requirements-legacy-release.txt
          --dest .pytest_cache/legacy-release
      - name: Prepare the published exact-confirmation admission fixture
        run: >-
          python -m pip download --require-hashes --no-deps --only-binary=:all:
          -r .github/requirements/requirements-release-admission.txt
          --dest .pytest_cache/legacy-release
      - name: Run the Windows coverage part
        env:
          PYTHONUNBUFFERED: "1"
          COVERAGE_FILE: ${{ runner.temp }}/windows.coverage
        run: >-
          python -m pytest -q -p no:cacheprovider -p tools.pytest_shard
          --shard-index=0 --shard-count=1 --shard-output=shard-windows.json
          --cov=synapse_channel --cov-report= --cov-fail-under=0
          tests/test_advertise_persistent.py
          tests/test_advisory_lock.py
          tests/test_aef_emission.py
          tests/test_aef_replay_store.py
          tests/test_agent_pane_state.py
          tests/test_archive_report.py
          tests/test_at_rest.py
          tests/test_at_rest_attestation.py
          tests/test_at_rest_cloud_hsm.py
          tests/test_at_rest_escrow.py
          tests/test_auto_action_store.py
          tests/test_capability_card_history.py
          tests/test_capability_card_trust.py
          tests/test_cli.py
          tests/test_cli_capability_cards.py
          tests/test_cli_deliberate.py
          tests/test_cli_doctor_token_set.py
          tests/test_cli_encrypt_key.py
          tests/test_cli_fleet_scorecard.py
          tests/test_cli_kimi_claim_hook.py
          tests/test_cli_lock_process.py
          tests/test_cli_lock_process_cancellation.py
          tests/test_cli_native_hook.py
          tests/test_cli_token_set.py
          tests/test_codex_mcp_package.py
          tests/test_core_errors.py
          tests/test_dashboard_host_sessions.py
          tests/test_durable_dir.py
          tests/test_host_sessions.py
          tests/test_host_sessions_tree.py
          tests/test_identity_keys.py
          tests/test_identity_keys_secret_floor.py
          tests/test_integrator_contract.py
          tests/test_kimi_hook_config_file.py
          tests/test_launch_record.py
          tests/test_leasing_drafts.py
          tests/test_mailbox_cursor.py
          tests/test_mcp_inbox.py
          tests/test_mcp_wake_ledger.py
          tests/test_mcp_wake_root_archive.py
          tests/test_mcp_wake_root_initialization.py
          tests/test_mcp_wake_storage_control.py
          tests/test_native_hook_spool.py
          tests/test_opencode_adapter_files.py
          tests/test_opencode_api_endpoint_port.py
          tests/test_opencode_auth.py
          tests/test_opencode_windows_native.py
          tests/test_operation_record_types.py
          tests/test_ordinary_claim_scope.py
          tests/test_path_identity.py
          tests/test_path_identity_inode_reuse.py
          tests/test_pid_monitor_accounting.py
          tests/test_private_dir.py
          tests/test_read_owner_only_file_bytes.py
          tests/test_result_verification.py
          tests/test_secret_files.py
          tests/test_secure_path.py
          tests/test_secure_path_reparse.py
          tests/test_secure_read_bounds.py
          tests/test_shared_host_regression.py
          tests/test_token_audit.py
          tests/test_token_sessions.py
          tests/test_token_set.py
          tests/test_token_set_hub_status.py
          tests/test_wake_adapter_codex_queue.py
          tests/test_wake_adapter_codex_queue_windows.py
          tests/test_wake_relay.py
          tests/test_worker_outcome_publication.py
          tests/test_worker_outcomes_native.py
      - name: Bind the successful Windows part into its artifact
        run: >-
          python tools/ci_shard_artifacts.py pack --platform win32
          --manifest shard-windows.json --coverage-file "${{ runner.temp }}/windows.coverage"
          --output ci-windows-artifact
      - name: Publish the Windows part only after its tests and pack succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-windows-${{ github.sha }}
          path: ci-windows-artifact/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

  test-complete:
    runs-on: ubuntu-latest
    needs: [test, test-windows]
    if: always()
    steps:
      - name: Require every matrix shard and the Windows part to succeed
        env:
          SHARD_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          if [ "$SHARD_RESULT" = success ] && [ "$WINDOWS_RESULT" = success ]; then
            exit 0
          fi
          echo "::error::The test matrix result is ${SHARD_RESULT:-empty} and the Windows coverage part is ${WINDOWS_RESULT:-empty}. Coverage is not qualified. Re-run the failed test jobs; this run keeps successful shard artifacts and the original timing snapshot."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pytest-shard-${{ github.sha }}-*
          path: ci-shards
          merge-multiple: false
      - name: Restore the Windows coverage part
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pytest-windows-${{ github.sha }}
          path: ci-windows
      - name: Restore the common immutable scheduling input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pytest-timings-${{ github.sha }}-${{ github.run_id }}
          path: timing-input
      - name: Verify every interpreter inventory and apply the full coverage gate
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python tools/ci_shard_artifacts.py verify --root ci-shards
          --source "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT"
          --allow-earlier-attempts
          --python 3.11 3.12 3.13 --count 4
          --timings timing-input/timings.json --coverage-python 3.12
          --coverage-config pyproject.toml --fail-under 99.36 --output ci-coverage
          --platform-coverage win32=ci-windows
      - name: Retain observed timings only after complete successful qualification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-shard-timings
          path: ci-coverage/timings.json
          if-no-files-found: error
          overwrite: true
      - name: Upload complete coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./ci-coverage/coverage.xml
          fail_ci_if_error: false
      - name: Preserve the authoritative complete coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-${{ github.sha }}
          path: |
            ci-coverage/coverage.json
            ci-coverage/coverage.xml
          if-no-files-found: error
          overwrite: true

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements-tools.txt
      - run: reuse lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements.txt
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit . --desc --progress-spinner=off

  git-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements.txt
      - name: Auto-release hooks install and self-test
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          synapse_bin="$RUNNER_TEMP/synapse-dev"
          cat > "$synapse_bin" <<'PY'
          #!/usr/bin/env python
          from synapse_channel.cli import main

          raise SystemExit(main())
          PY
          chmod +x "$synapse_bin"
          scratch="$(mktemp -d)"
          git -C "$scratch" init -q
          # A fresh repo has no auto-release hooks: `git-hook test` must fail (non-zero),
          # so a broken or no-op install is caught instead of silently passing.
          if (cd "$scratch" && "$synapse_bin" git-hook test); then
            echo "::error::git-hook test passed on a repo with no auto-release hooks installed"
            exit 1
          fi
          # After `git-init`, both hooks are installed and their baked-in synapse path
          # resolves, so `git-hook test` must pass (exit 0).
          (cd "$scratch" && "$synapse_bin" git-init --name ci --synapse-bin "$synapse_bin")
          (cd "$scratch" && "$synapse_bin" git-hook test)
          rm -rf "$scratch"

  pi-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Refuse unchecked Pi registry tarballs
        run: python tools/check_pi_lock_integrity.py
      - name: Install exact Pi integration dependencies without lifecycle scripts
        working-directory: integrations/pi
        run: |
          npm ci --ignore-scripts
          python ../../tools/sync_pi_dependency_pins.py
      - name: Type-check and exercise the Pi extension
        working-directory: integrations/pi
        run: |
          npm run typecheck
          npm test

  marketplace-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare real policy-check inputs
        run: |
          mkdir -p action-smoke
          cat > action-smoke/policy.json <<'JSON'
          {"version":1,"mode":"enforcement","rules":{"required_tests":{"commands":["pytest"]}}}
          JSON
          cat > action-smoke/pass.json <<'JSON'
          {"task_id":"T1","owner":"ci","evidence":["pytest -q passed"],"changed_files":[]}
          JSON
          cat > action-smoke/fail.json <<'JSON'
          {"task_id":"T1","owner":"ci","evidence":[],"changed_files":[]}
          JSON
      - name: Accept a passing receipt through the composite Action
        id: accepted
        uses: ./
        with:
          task: T1
          policy: action-smoke/policy.json
          receipt-json: action-smoke/pass.json
          version: "0.99.27"
      - name: Refuse missing evidence through the composite Action
        id: refused
        continue-on-error: true
        uses: ./
        with:
          task: T1
          policy: action-smoke/policy.json
          receipt-json: action-smoke/fail.json
          version: "0.99.27"
      - name: Verify the observed Action reports and exit status
        env:
          ACCEPTED_REPORT: ${{ steps.accepted.outputs.report }}
          REFUSED_REPORT: ${{ steps.refused.outputs.report }}
          REFUSED_OUTCOME: ${{ steps.refused.outcome }}
        run: |
          python - <<'PY'
          import json
          import os

          assert json.loads(os.environ["ACCEPTED_REPORT"])["overall"] == "pass"
          assert json.loads(os.environ["REFUSED_REPORT"])["overall"] == "fail"
          assert os.environ["REFUSED_OUTCOME"] == "failure"
          PY

  python-lock-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/requirements.txt
      - name: Audit every committed Python lock and requirement input
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- ':(glob)**/requirements*.txt' > "$RUNNER_TEMP/python-locks.list"
          test -s "$RUNNER_TEMP/python-locks.list"
          audit_status=0
          while IFS= read -r -d '' lock; do
            audit_flags=()
            if grep -q -- '--hash=' "$lock"; then
              audit_flags=(--disable-pip --require-hashes)
            fi
            if ! python -m pip_audit "${audit_flags[@]}" \
                -r "$lock" --desc --progress-spinner=off; then
              audit_status=1
            fi
          done < "$RUNNER_TEMP/python-locks.list"
          exit "$audit_status"

  node-lock-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Audit every committed npm lock without installing packages
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- ':(glob)**/package-lock.json' > "$RUNNER_TEMP/node-locks.list"
          test -s "$RUNNER_TEMP/node-locks.list"
          audit_status=0
          while IFS= read -r -d '' lock; do
            if ! (cd "$(dirname "$lock")" && npm audit --package-lock-only); then
              audit_status=1
            fi
          done < "$RUNNER_TEMP/node-locks.list"
          exit "$audit_status"

  # Single required status check for branch protection. It always runs (even when an
  # upstream job fails), so the `ci` context posts on every pull request and push,
  # and it fails unless every gated job succeeded — matrix-drift-proof, unlike pinning
  # each individual job as a required context.
  ci:
    name: ci
    needs: [test-timings, lint, typecheck, test, test-windows, test-complete, reuse, audit, git-hooks, pi-integration, marketplace-action, python-lock-audit, node-lock-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gated job to succeed
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "gated job results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required ci job did not succeed (${result})"
              exit 1
            fi
          done
          echo "all required ci jobs succeeded"
