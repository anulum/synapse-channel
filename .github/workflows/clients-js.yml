name: clients-js

on:
  push:
    paths:
      - "clients/js/**"
      - "src/synapse_channel/**"
      - "pyproject.toml"
      - ".github/requirements/requirements-publish-smoke.txt"
      - ".github/workflows/clients-js.yml"
  pull_request:
    paths:
      - "clients/js/**"
      - "src/synapse_channel/**"
      - "pyproject.toml"
      - ".github/requirements/requirements-publish-smoke.txt"
      - ".github/workflows/clients-js.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/requirements-publish-smoke.txt
      - name: Install hash-locked hub dependencies
        working-directory: .
        run: python -m pip install --require-hashes -r .github/requirements/requirements-publish-smoke.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test SDK against the Python hub
        run: npm run test:integration
