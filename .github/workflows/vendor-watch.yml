# SYNAPSE CHANNEL — read-only official vendor source check
name: vendor-watch

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check official releases against the reviewed matrix
        run: python tools/vendor_watch.py --strict --report "$RUNNER_TEMP/vendor-watch.json"
      - name: Summarize the dated result
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/vendor-watch.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REPORT_PATH"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not path.exists():
              summary.write_text("## Vendor watch\n\nSource check failed before a report was written.\n")
              raise SystemExit(1)
          report = json.loads(path.read_text())
          lines = [
              "## Vendor watch",
              "",
              f"Checked: {report['checked_at']}; next manual review: {report['next_review_at']}",
              "",
              "| Surface | Latest | Verified | Status | Priority |",
              "|---|---|---|---|---|",
          ]
          for name, row in report["surfaces"].items():
              lines.append(
                  f"| {name} | {row.get('latest_version', 'unknown')} | "
                  f"{row.get('verified_version') or 'unverified'} | "
                  f"{row['status']} | {row['priority']} |"
              )
          summary.write_text("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: vendor-watch-report
          path: ${{ runner.temp }}/vendor-watch.json
          if-no-files-found: warn
          retention-days: 7
